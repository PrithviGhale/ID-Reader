name: Build and release AgeCheck
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Choose version
        shell: pwsh
        run: |
          $version = '1.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Use a stable version tag such as v1.0.1' }
            $version = $Matches[1]
          }
          "AGECHECK_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test, build and package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:AGECHECK_VERSION
      - name: Preserve installer and update feed
        uses: actions/upload-artifact@v4
        with:
          name: AgeCheck-win-x64
          path: artifacts/releases/*
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          dotnet vpk upload github --repoUrl $config.repositoryUrl --token $env:GH_TOKEN --publish --releaseName "AgeCheck $env:AGECHECK_VERSION" --tag $env:GITHUB_REF_NAME --channel $config.channel --outputDir artifacts/releases
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
